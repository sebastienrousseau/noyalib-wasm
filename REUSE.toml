# REUSE 3.3 annotations: blanket licensing for files that don't
# carry an inline SPDX header (config, fixtures, generated
# artefacts). Source code files (.rs) keep their inline SPDX
# headers — this file only fills in the gaps.
#
# Documented at https://reuse.software/spec-3.3/

version = 1

# ── Project meta / config files ───────────────────────────────────
[[annotations]]
path = [
    ".editorconfig",
    ".gitattributes",
    ".gitignore",
    ".rustfmt.toml",
    "Cargo.toml",
    "Cargo.lock",
    "deny.toml",
    "osv-scanner.toml",
    "rust-toolchain.toml",
    "REUSE.toml",
    "supply-chain/audits.toml",
    "supply-chain/config.toml",
    "supply-chain/imports.lock",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Noyalib"
SPDX-License-Identifier = "MIT OR Apache-2.0"

# ── CI workflows ──────────────────────────────────────────────────
[[annotations]]
path = ".github/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Noyalib"
SPDX-License-Identifier = "MIT OR Apache-2.0"

# ── Documentation ─────────────────────────────────────────────────
[[annotations]]
path = [
    "README.md",
    "CHANGELOG.md",
    "SECURITY.md",
    "docs/**",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Noyalib"
SPDX-License-Identifier = "MIT OR Apache-2.0"

# ── Test fixtures + examples ──────────────────────────────────────
[[annotations]]
path = [
    "index.html",
    "examples/**",
    "tests/**",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Noyalib"
SPDX-License-Identifier = "MIT OR Apache-2.0"

# The release-signing public key. A PGP armored block cannot carry SPDX
# headers without corrupting the armor, so it is annotated here instead.
[[annotations]]
path = "KEYS.asc"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Noyalib"
SPDX-License-Identifier = "MIT OR Apache-2.0"

# ── Fuzz crate scaffolding ────────────────────────────────────────
# The targets themselves carry SPDX headers. These three cannot: a
# .gitignore has no comment convention REUSE recognises, and the two
# Cargo files are regenerated by cargo, which strips added headers.
# The core annotates the same trio the same way.
[[annotations]]
path = [
    "fuzz/.gitignore",
    "fuzz/Cargo.toml",
    "fuzz/Cargo.lock",
    "fuzz/corpus/**",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Noyalib"
SPDX-License-Identifier = "MIT OR Apache-2.0"

# ── Family layout files (Phase 1, docs/ECOSYSTEM.md in the core) ──
[[annotations]]
path = ["DEVELOPMENT.md", "CONTRIBUTING.md", ".editorconfig", ".markdownlint.yaml", ".codespellrc"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Noyalib"
SPDX-License-Identifier = "MIT OR Apache-2.0"
