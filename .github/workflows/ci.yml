name: CI

# Every job here consumes a reusable workflow from
# `sebastienrousseau/noyalib` pinned by SHA. A supply-chain
# hardening pass in noyalib propagates to this satellite via a
# Dependabot SHA-bump PR — enforced by the 48h propagation SLA
# monitor in the parent repo (scripts/shared-workflow-propagation-monitor.sh).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Caller-side permissions must be at least as broad as every
# reusable workflow's declared `permissions:` block.
# `shared-verify-signatures.yml` needs `pull-requests: read` to
# iterate PR commits via the REST API.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-lint:
    uses: sebastienrousseau/noyalib/.github/workflows/shared-docs-lint.yml@7529f1b3557ec62be0ae6c3a1cd968863a0fbe28
  readme-examples:
    # Every ```rust block in README.md compiles against this crate.
    uses: sebastienrousseau/noyalib/.github/workflows/shared-readme-examples.yml@7529f1b3557ec62be0ae6c3a1cd968863a0fbe28
  yaml-test-suite:
    uses: sebastienrousseau/noyalib/.github/workflows/shared-yaml-test-suite.yml@7529f1b3557ec62be0ae6c3a1cd968863a0fbe28
  cargo-deny:
    uses: sebastienrousseau/noyalib/.github/workflows/shared-cargo-deny.yml@7529f1b3557ec62be0ae6c3a1cd968863a0fbe28

  cargo-vet:
    uses: sebastienrousseau/noyalib/.github/workflows/shared-cargo-vet.yml@7529f1b3557ec62be0ae6c3a1cd968863a0fbe28

  cargo-machete:
    uses: sebastienrousseau/noyalib/.github/workflows/shared-cargo-machete.yml@7529f1b3557ec62be0ae6c3a1cd968863a0fbe28

  reuse-lint:
    uses: sebastienrousseau/noyalib/.github/workflows/shared-reuse.yml@7529f1b3557ec62be0ae6c3a1cd968863a0fbe28

  docs-strict:
    uses: sebastienrousseau/noyalib/.github/workflows/shared-rustdoc-strict.yml@7529f1b3557ec62be0ae6c3a1cd968863a0fbe28

  verify-signatures:
    uses: sebastienrousseau/noyalib/.github/workflows/shared-verify-signatures.yml@7529f1b3557ec62be0ae6c3a1cd968863a0fbe28

  test-matrix:
    # `noyalib-wasm` is a wasm-bindgen crate; the OS matrix is
    # narrowed to ubuntu-latest only — the JS binding surface is
    # exercised end-to-end by wasm-bindgen-test under node (the
    # `wasm-test` job below) rather than by native `cargo test` on
    # macOS/Windows.
    uses: sebastienrousseau/noyalib/.github/workflows/shared-test-matrix.yml@7529f1b3557ec62be0ae6c3a1cd968863a0fbe28
    with:
      os-list: '["ubuntu-latest"]'
      toolchain-list: '["stable", "nightly"]'

  # ── A+ rigor parity with the core ──────────────────────────────────
  wasm-test:
    # Runs the wasm-bindgen-test suite under node — the ONLY way to
    # reach the `#[wasm_bindgen]` exports in src/lib.rs, which native
    # `cargo test` cannot execute. This is the gate that proves the JS
    # surface (WasmDocument + the free functions) actually works.
    name: wasm-bindgen-test (node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa # v0.4.0
        with:
          version: 'v0.15.0'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: wasm-pack test --node
        run: wasm-pack test --node
      - name: Hostile input leaves the instance usable
        run: |
          wasm-pack build --dev --target nodejs --out-dir pkg-node
          node scripts/check-hostile-input.js pkg-node

  coverage-gate:
    # Native coverage gates the pure-Rust core (src/core.rs, measured
    # ~100 %). src/lib.rs is the `#[wasm_bindgen]` FFI layer — it is
    # unreachable by native `cargo test` and is instead gated by the
    # `wasm-test` job above, so it is excluded here rather than
    # counted as an un-fixable coverage hole.
    uses: sebastienrousseau/noyalib/.github/workflows/shared-coverage.yml@7529f1b3557ec62be0ae6c3a1cd968863a0fbe28
    with:
      ignore-filename-regex: 'src/lib\.rs'
      fail-under-functions: 96
      fail-under-lines: 94
      fail-under-regions: 93

  msrv-core:
    # Verifies the declared 1.89.0 floor actually builds.
    uses: sebastienrousseau/noyalib/.github/workflows/shared-msrv-core.yml@7529f1b3557ec62be0ae6c3a1cd968863a0fbe28
    with:
      toolchain: "1.89.0"

  fuzz-regression:
    # Every fuzz target builds on every push, and the seed corpus (plus
    # any fixed-bug regression inputs under fuzz/regressions/<target>/)
    # is replayed with -runs=0, so a fixed finding stays fixed.
    name: fuzz-regression
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target-fuzz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ". -> target-fuzz"
          key: fuzz-regression
      - run: cargo install --locked cargo-fuzz
      - name: Build every fuzz target
        run: cargo +nightly fuzz build
      - name: Replay seed corpus and fixed-bug regressions
        run: |
          set -euo pipefail
          cd fuzz
          for f in fuzz_targets/*.rs; do
            t=$(basename "$f" .rs)
            dirs=(corpus/seed)
            [ -d "regressions/$t" ] && dirs+=("regressions/$t")
            echo "── replaying $t against: ${dirs[*]}"
            cargo +nightly fuzz run "$t" "${dirs[@]}" -- -runs=0
          done

  # ── Workflow gates shared with the core (v0.0.55) ───────────────────
  # actionlint: workflow files are well-formed (shellcheck included).
  # zizmor: workflow security audit, failing at medium and above.
  # single-publisher: only release.yml may publish anything.
  actionlint:
    uses: sebastienrousseau/noyalib/.github/workflows/shared-actionlint.yml@7529f1b3557ec62be0ae6c3a1cd968863a0fbe28
  zizmor:
    uses: sebastienrousseau/noyalib/.github/workflows/shared-zizmor.yml@7529f1b3557ec62be0ae6c3a1cd968863a0fbe28
  single-publisher:
    uses: sebastienrousseau/noyalib/.github/workflows/shared-single-publisher.yml@7529f1b3557ec62be0ae6c3a1cd968863a0fbe28
